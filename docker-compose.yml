services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kodex
      POSTGRES_PASSWORD: kodexlocal
      POSTGRES_DB: kodex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      PORT: 8000
      DATABASE_URL: postgresql://kodex:kodexlocal@postgres:5432/kodex
      JWT_SECRET: ${JWT_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend


volumes:
  pgdata: